<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Q&A Web App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 text-center">Smart Q&A Web App</h2>

        <form method="POST" enctype="multipart/form-data" class="mb-4">
            <div class="mb-3">
                <label class="form-label">Upload TXT or PDF (Multiple allowed):</label>
                <input type="file" class="form-control" name="file" multiple>
            </div>
            <div class="mb-3">
                <label class="form-label">Ask a Question:</label>
                <textarea class="form-control" name="question" rows="3"
                    placeholder="Type your question here..."></textarea>
            </div>
            <button type="submit" class="btn btn-success">Submit</button>
        </form>

        {% if files %}
        <div class="mb-3">
            <h5>Uploaded Files:</h5>
            <ul class="list-group">
                {% for f in files %}
                <li class="list-group-item">{{ f }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        {% if answer %}
        <div class="card mt-4">
            <div class="card-header bg-success text-white">Answer</div>
            <div class="card-body">
                {{ answer | safe }}
            </div>
        </div>
        {% endif %}
    </div>
</body>

</html>
