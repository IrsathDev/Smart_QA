<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Smart Q&A Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }

        .chat-container {
            max-width: 800px;
            margin: auto;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        .msg {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 70%;
        }

        .user {
            background: #d1e7dd;
            margin-left: auto;
        }

        .bot {
            background: #e2e3e5;
            margin-right: auto;
        }

        .time {
            font-size: 11px;
            color: gray;
        }

        .sources {
            font-size: 12px;
            color: #555;
        }

        .input-box {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container mt-3">
        <h4 class="text-center mb-3">💬 Smart Q&A Assistant</h4>

        <div class="chat-container">

            <div class="chat-box" id="chatBox">

                {% for msg in chat_history %}
                <div class="msg {% if msg.role == 'user' %}user{% else %}bot{% endif %}">

                    <!-- MESSAGE (FIXED) -->
                    {{ msg.content }}

                    <!-- SOURCES -->
                    {% if msg.sources %}
                    <div class="sources">
                        📄 Highlighted Text / Sources:
                        {% for s in msg.sources %}
                        <mark>{{ s }}</mark>
                        {% endfor %}
                    </div>
                    {% endif %}

                    <div class="time">{{ msg.time }}</div>
                </div>
                {% endfor %}

            </div>

            <div id="loading" class="text-center mt-2" style="display:none;">
                <div class="spinner-border text-success"></div>
                <p>AI is typing...</p>
            </div>

            <form method="POST" enctype="multipart/form-data" class="input-box">
                <input type="file" name="file" multiple class="form-control mb-2">
                <div class="input-group">
                    <input type="text" name="question" class="form-control" placeholder="Ask your question..." required>
                    <button class="btn btn-success">Send</button>
                </div>
            </form>

        </div>
    </div>

    <script>
        // Loading spinner
        const form = document.querySelector("form");
        const loading = document.getElementById("loading");

        form.addEventListener("submit", () => {
            loading.style.display = "block";
        });

        // Auto scroll
        const chatBox = document.getElementById("chatBox");
        chatBox.scrollTop = chatBox.scrollHeight;
    </script>

</body>

</html>
